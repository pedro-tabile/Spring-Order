spring.application.name=Order_Spring_DesignPatterns

spring.jpa.show-sql=true

### propriedade que pega o valor da variável de ambiente; caso não seja encontrado, o valor é "my-secret-key"
api.security.token.secret=${JWT_SECURITY:my-secret-key}

### Configurações LLM - Google GenAI: token, modelo de chat, tipo de resposta e variação na resposta
spring.ai.google.genai.api-key=${TOKEN_API_GOOGLE_GENAI}
spring.ai.google.genai.chat.model=gemini-3.6-flash
spring.ai.google.genai.chat.response-mime-type=application/json
spring.ai.google.genai.chat.temperature=0.6